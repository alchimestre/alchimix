<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="424" viewBox="0 0 1200 424" role="img" aria-labelledby="title desc">
  <title id="title">alchimix</title>
  <desc id="desc">alchimix builds DJ sets block by block from a rekordbox collection. Four track blocks stack down a canvas; coloured arrows between them show the Camelot step and triangles show which way the energy moves.</desc>

  <rect width="1200" height="424" rx="24" fill="#1e1f27"/>

  <g id="title-block" transform="translate(64 12)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="0" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#9299b8" letter-spacing="2">REKORDBOX · CAMELOT · TEMPO</text>
    <text x="0" y="186" font-size="84" font-weight="700" fill="#f8f8f2" letter-spacing="-2">alchimix</text>
    <text x="0" y="242" font-size="27" fill="#c3c7d9">Build a DJ set block by block.</text>
    <text x="0" y="280" font-size="27" fill="#c3c7d9">See what fits next, hear it in time,</text>
    <text x="0" y="318" font-size="27" fill="#c3c7d9">save it back to rekordbox.</text>
  </g>

  <g id="crate" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="620" y="24" width="540" height="376" rx="16" fill="#21222c"/>

    <g transform="translate(650 44)">
      <rect width="480" height="60" rx="10" fill="#44475a"/>
      <text x="20" y="38" font-size="22" font-weight="600" fill="#f8f8f2">Night Bus</text>
      <text x="460" y="38" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#9299b8"><tspan fill="#f8f8f2">8A</tspan>  124</text>
      <rect x="10" y="54" width="300" height="4" rx="2" fill="#50fa7b"/>
    </g>

    <g transform="translate(882 108)">
      <path d="M8 0 V20 M0 13 L8 22 L16 13" stroke="#b8c94a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="30,20 38,6 46,20" fill="#b8c94a"/>
    </g>

    <g transform="translate(650 136)">
      <rect width="480" height="60" rx="10" fill="#343746"/>
      <text x="20" y="38" font-size="22" font-weight="600" fill="#f8f8f2">Low Tide</text>
      <text x="460" y="38" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#9299b8"><tspan fill="#f8f8f2">9A</tspan>  124</text>
    </g>

    <g transform="translate(882 200)">
      <path d="M8 0 V20 M0 13 L8 22 L16 13" stroke="#50fa7b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(650 228)">
      <rect width="480" height="60" rx="10" fill="#343746"/>
      <text x="20" y="38" font-size="22" font-weight="600" fill="#f8f8f2">Glasshouse</text>
      <text x="460" y="38" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#9299b8"><tspan fill="#f8f8f2">9B</tspan>  126</text>
    </g>

    <g transform="translate(882 292)">
      <path d="M8 0 V20 M0 13 L8 22 L16 13" stroke="#f1fa8c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="30,20 38,6 46,20" fill="#f1fa8c"/>
      <polygon points="52,20 60,6 68,20" fill="#f1fa8c"/>
    </g>

    <g transform="translate(650 320)">
      <rect width="480" height="60" rx="10" fill="#343746"/>
      <text x="20" y="38" font-size="22" font-weight="600" fill="#f8f8f2">Fold Line</text>
      <text x="460" y="38" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#9299b8"><tspan fill="#f8f8f2">11B</tspan>  128</text>
    </g>
  </g>
</svg>
